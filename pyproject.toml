[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastapi-ai-telemetry"
version = "0.1.0"
description = "Privacy-safe request and model-call telemetry for FastAPI and Starlette applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shruti Lekkala" }]
keywords = ["fastapi", "observability", "llm", "telemetry", "middleware", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = ["starlette>=0.37"]

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.20"]
example = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
test = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/shrutilekkala/fastapi-ai-telemetry"
Issues = "https://github.com/shrutilekkala/fastapi-ai-telemetry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_ai_telemetry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
